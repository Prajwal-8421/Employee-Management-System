version: '3.8'

services:

  backend:
    build:
      context: ./back_End
    container_name: employee-backend
    ports:
      - "9091:8000"
    environment:
      - SERVER_PORT=8000

  frontend:
    build:
      context: ./front
    container_name: employee-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend