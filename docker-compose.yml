services:

  db:
    image: mariadb:10.11
    container_name: employee-db
    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_USER: dockeruser
      MYSQL_PASSWORD: dockerpass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  backend:
    build:
      context: ./back_End
    container_name: employee-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/employee_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=dockeruser
      - SPRING_DATASOURCE_PASSWORD=dockerpass
    depends_on:
      - db

  frontend:
    build:
      context: ./front
    container_name: employee-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend